
name: Test Local AI Summary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install \
            torch==2.5.1 \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install model dependencies
        run: |
          python -m pip install \
            transformers==4.46.3 \
            safetensors==0.4.5

      - name: Run one-paper AI test
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/test_local_summary.py
